<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Story Sticker Studio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "on-tertiary-fixed": "#1a1c1c",
                "primary-fixed": "#e2e2e2",
                "on-tertiary": "#2f3131",
                "surface-container-lowest": "#0b0e14",
                "surface-dim": "#10131a",
                "surface-container-low": "#191c22",
                "on-tertiary-container": "#636565",
                "on-surface": "#e1e2eb",
                "on-secondary-container": "#b3b8c7",
                "on-error-container": "#ffdad6",
                "on-background": "#e1e2eb",
                "tertiary": "#ffffff",
                "on-primary-container": "#636565",
                "tertiary-fixed-dim": "#c6c6c7",
                "surface-tint": "#c6c6c7",
                "on-primary-fixed": "#1a1c1c",
                "outline": "#8e9192",
                "error-container": "#93000a",
                "secondary-fixed-dim": "#c1c6d6",
                "on-error": "#690005",
                "on-primary": "#2f3131",
                "tertiary-container": "#e2e2e2",
                "inverse-on-surface": "#2e3037",
                "primary": "#ffffff",
                "on-primary-fixed-variant": "#454747",
                "surface-bright": "#363940",
                "outline-variant": "#444748",
                "on-secondary-fixed-variant": "#414753",
                "error": "#ffb4ab",
                "tertiary-fixed": "#e2e2e2",
                "primary-container": "#e2e2e2",
                "on-tertiary-fixed-variant": "#454747",
                "surface-container": "#1d2026",
                "secondary-container": "#434956",
                "inverse-primary": "#5d5f5f",
                "background": "#10131a",
                "surface-variant": "#32353c",
                "on-secondary-fixed": "#161c27",
                "surface-container-high": "#272a31",
                "secondary": "#c1c6d6",
                "surface-container-highest": "#32353c",
                "primary-fixed-dim": "#c6c6c7",
                "secondary-fixed": "#dde2f2",
                "inverse-surface": "#e1e2eb",
                "surface": "#10131a",
                "on-surface-variant": "#c4c7c8",
                "on-secondary": "#2b313c"
              },
              "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
              },
              "spacing": {
                "xl": "32px",
                "gutter": "12px",
                "container-padding": "20px",
                "base": "4px",
                "md": "16px",
                "sm": "12px",
                "xs": "8px",
                "lg": "24px"
              },
              "fontFamily": {
                "headline-xl-mobile": ["Inter"],
                "headline-xl": ["Inter"],
                "headline-lg": ["Inter"],
                "body-md": ["Inter"],
                "body-lg": ["Inter"],
                "label-caps": ["Inter"],
                "headline-md": ["Inter"]
              },
              "fontSize": {
                "headline-xl-mobile": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.03em", "fontWeight": "700" }],
                "headline-xl": ["32px", { "lineHeight": "36px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                "headline-lg": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }],
                "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }],
                "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                "headline-md": ["20px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
              }
            },
          },
        }
    </script>
<style>
        /* Hide scrollbar for carousel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom glow utilities */
        .glow-white {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }
        .hairline-border {
            border-width: 0.5px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen pt-14 pb-20 selection:bg-primary/20 selection:text-primary">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary fixed top-0 w-full z-50 border-b border-outline-variant/10 flex items-center px-gutter h-14 w-full transition-opacity duration-200 justify-between">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tighter">SecretMsg</h1>
<button class="font-body-md text-primary px-2 hover:opacity-80 transition-opacity">Reset</button>
</header>
<main class="px-container-padding flex flex-col items-center">
<!-- Live Preview Canvas -->
<section class="w-full max-w-sm mt-lg flex flex-col items-center">
<!-- 9:16 Mockup Frame -->
<div class="relative w-full aspect-[9/16] bg-surface-dim rounded-[32px] hairline-border border-outline/30 overflow-hidden shadow-2xl flex items-center justify-center">
<!-- Abstract blurred background to simulate a photo -->
<div class="absolute inset-0 bg-gradient-to-br from-purple-900/40 via-surface-container-lowest to-blue-900/30"></div>
<div class="absolute w-64 h-64 bg-primary/5 rounded-full blur-3xl top-1/4 -left-10"></div>
<!-- Floating Sticker -->
<div class="relative z-10 w-3/4 max-w-[280px] bg-[#151B26]/80 backdrop-blur-[20px] rounded-[24px] hairline-border border-white/20 p-6 flex flex-col items-center gap-sm transform transition-transform hover:scale-105 duration-300 ease-out shadow-[0_8px_32px_rgba(0,0,0,0.4)] glow-white">
<div class="absolute -top-3 right-4 w-6 h-6 bg-primary rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-[14px] text-surface-container-lowest" data-icon="push_pin" data-weight="fill" style="font-variation-settings: 'FILL' 1;">push_pin</span>
</div>
<h2 class="font-headline-lg text-headline-lg-mobile text-center text-primary tracking-tight leading-tight mb-2">
                        send me anonymous tbh messages 🫣
                    </h2>
<div class="bg-surface-container-highest/50 px-4 py-2 rounded-full hairline-border border-outline-variant/30 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
<span class="font-label-caps text-label-caps text-on-surface">@janasco</span>
</div>
<div class="w-full h-[1px] bg-gradient-to-r from-transparent via-outline-variant/40 to-transparent my-2"></div>
<p class="font-body-md text-[12px] text-on-surface-variant text-center opacity-80">
                        Tap to reply on secretmsg.net
                    </p>
</div>
</div>
</section>
<!-- Customization Controls -->
<section class="w-full max-w-sm mt-xl flex flex-col gap-lg">
<!-- Theme Palette -->
<div class="flex flex-col gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest pl-1">Theme</span>
<div class="flex items-center gap-sm">
<button class="w-10 h-10 rounded-full bg-[#151B26] hairline-border border-white glow-white ring-2 ring-primary ring-offset-2 ring-offset-surface-container-lowest transition-all"></button>
<button class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-500 to-cyan-500 hairline-border border-white/20 opacity-70 hover:opacity-100 transition-all"></button>
<button class="w-10 h-10 rounded-full bg-gradient-to-br from-orange-500 to-yellow-500 hairline-border border-white/20 opacity-70 hover:opacity-100 transition-all"></button>
<button class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-400 to-pink-300 hairline-border border-white/20 opacity-70 hover:opacity-100 transition-all"></button>
<button class="w-10 h-10 rounded-full bg-primary hairline-border border-white/20 opacity-70 hover:opacity-100 transition-all"></button>
</div>
</div>
<!-- Questions Carousel -->
<div class="flex flex-col gap-xs w-full overflow-hidden">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest pl-1">Prompt Style</span>
<div class="flex overflow-x-auto gap-sm pb-2 no-scrollbar px-1">
<button class="px-5 py-2.5 rounded-full bg-primary text-on-primary font-body-md font-semibold whitespace-nowrap shadow-[0_0_10px_rgba(255,255,255,0.2)]">TBH</button>
<button class="px-5 py-2.5 rounded-full bg-[#151B26] hairline-border border-outline/30 text-on-surface font-body-md whitespace-nowrap hover:bg-surface-variant transition-colors">Crush</button>
<button class="px-5 py-2.5 rounded-full bg-[#151B26] hairline-border border-outline/30 text-on-surface font-body-md whitespace-nowrap hover:bg-surface-variant transition-colors">Assumptions</button>
<button class="px-5 py-2.5 rounded-full bg-[#151B26] hairline-border border-outline/30 text-on-surface font-body-md whitespace-nowrap hover:bg-surface-variant transition-colors">Confessions</button>
<button class="px-5 py-2.5 rounded-full bg-[#151B26] hairline-border border-outline/30 text-on-surface font-body-md whitespace-nowrap hover:bg-surface-variant transition-colors">First Impression</button>
</div>
</div>
</section>
<!-- Actions -->
<section class="w-full max-w-sm mt-xl mb-xl flex flex-col gap-sm">
<button class="w-full h-12 bg-primary text-on-primary rounded-full font-headline-md text-[16px] flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all glow-white">
<span class="material-symbols-outlined text-[20px]" data-icon="ios_share">ios_share</span>
                Share to Stories
            </button>
<button class="w-full h-12 bg-transparent hairline-border border-outline/50 text-primary rounded-full font-headline-md text-[16px] flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
                Download Sticker
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/95 backdrop-blur-xl border-t border-outline-variant/10 fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-safe z-50">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-outline hover:text-primary/80 active:scale-95 transition-all duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<!-- Dice -->
<button class="flex flex-col items-center justify-center text-outline hover:text-primary/80 active:scale-95 transition-all duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="casino">casino</span>
<span class="font-label-caps text-label-caps">Dice</span>
</button>
<!-- Stickers (Active) -->
<button class="flex flex-col items-center justify-center text-primary fill-primary active:scale-95 transition-all duration-150 w-16">
<span class="material-symbols-outlined mb-1 text-primary drop-shadow-[0_0_8px_rgba(255,255,255,0.4)]" data-icon="sticky_note_2" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sticky_note_2</span>
<span class="font-label-caps text-label-caps text-primary">Stickers</span>
</button>
<!-- Inbox -->
<button class="flex flex-col items-center justify-center text-outline hover:text-primary/80 active:scale-95 transition-all duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="mail">mail</span>
<span class="font-label-caps text-label-caps">Inbox</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-outline hover:text-primary/80 active:scale-95 transition-all duration-150 w-16">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</nav>
</body></html>
