<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Die Geometry
const geometry = new THREE.BoxGeometry(2, 2, 2);

// Materials for each face of the die
const createFaceMaterial = (text) => {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    
    // Background
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, 256, 256);
    
    // Dot/Text
    ctx.fillStyle = '#0B0E14';
    ctx.font = 'bold 160px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 128);
    
    const texture = new THREE.CanvasTexture(canvas);
    return new THREE.MeshPhongMaterial({ map: texture, shininess: 100 });
};

const materials = [
    createFaceMaterial('1'),
    createFaceMaterial('2'),
    createFaceMaterial('3'),
    createFaceMaterial('4'),
    createFaceMaterial('5'),
    createFaceMaterial('6')
];

const die = new THREE.Mesh(geometry, materials);
scene.add(die);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Animation
let targetRotationX = 0;
let targetRotationY = 0;
let isRolling = false;

function animate() {
    requestAnimationFrame(animate);
    
    if (isRolling) {
        die.rotation.x += 0.2;
        die.rotation.y += 0.3;
    } else {
        die.rotation.x += (targetRotationX - die.rotation.x) * 0.05;
        die.rotation.y += (targetRotationY - die.rotation.y) * 0.05;
        
        // Subtle floating
        die.position.y = Math.sin(Date.now() * 0.002) * 0.1;
    }
    
    renderer.render(scene, camera);
}

animate();

// Event listener for "Roll"
window.addEventListener('message', (event) => {
    if (event.data.type === 'ROLL_DICE') {
        isRolling = true;
        setTimeout(() => {
            isRolling = false;
            targetRotationX = Math.round(Math.random() * 4) * Math.PI / 2;
            targetRotationY = Math.round(Math.random() * 4) * Math.PI / 2;
        }, 800);
    }
});

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

})();
</script>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const rollBtn = document.getElementById('btn-roll');
            const featuredPrompt = document.getElementById('featured-prompt');
            
            const dummyPrompts = [
                "What's one thing you'd change about me? 🛠️",
                "Describe my vibe in 3 words. 🗣️",
                "If we were in a movie, what role would I play? 🎬",
                "Send me an honest TBH. Don't hold back 🫣"
            ];
            
            if (rollBtn && featuredPrompt) {
                rollBtn.addEventListener('click', () => {
                    // Temporarily remove pulse class during 'rolling'
                    rollBtn.classList.remove('pulse-glow');
                    rollBtn.style.transform = 'scale(0.95)';
                    
                    // Simple text shuffle effect
                    let shuffleCount = 0;
                    const interval = setInterval(() => {
                        featuredPrompt.textContent = dummyPrompts[Math.floor(Math.random() * dummyPrompts.length)];
                        shuffleCount++;
                        if (shuffleCount > 10) {
                            clearInterval(interval);
                            // Set a final random one
                            featuredPrompt.textContent = dummyPrompts[Math.floor(Math.random() * dummyPrompts.length)];
                            
                            // Restore button state
                            rollBtn.style.transform = '';
                            setTimeout(() => rollBtn.classList.add('pulse-glow'), 500);
                        }
                    }, 50);
                });
            }
        });
    </script>
