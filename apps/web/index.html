<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SecretMsg - Send & Receive Anonymous Messages</title>
    <meta name="description" content="Send and receive honest, private anonymous messages with your personalized secretmsg.net link. Safe, fast, and open source." />
    <link rel="canonical" href="https://secretmsg.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecretMsg" />
    <meta property="og:title" content="SecretMsg - Send & Receive Anonymous Messages" />
    <meta property="og:description" content="Send and receive honest, private anonymous messages with your personalized secretmsg.net link. Safe, fast, and open source." />
    <meta property="og:url" content="https://secretmsg.net/" />
    <meta property="og:image" content="https://secretmsg.net/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SecretMsg - Send & Receive Anonymous Messages" />
    <meta name="twitter:description" content="Send and receive honest, private anonymous messages with your personalized secretmsg.net link." />
    <meta name="twitter:image" content="https://secretmsg.net/logo.svg" />
    <meta name="theme-color" content="#0f111a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script>
      (function(){
        // Must match lib/theme.ts (THEME_KEY + values) or first paint flashes.
        // Default when unset/unknown: follow the OS (prefers-color-scheme).
        var s=null;
        try { s=localStorage.getItem("secretmsg_theme"); } catch(e) {}
        var d=window.matchMedia("(prefers-color-scheme:dark)").matches;
        var dark=s==="dark"||(!s||s==="system"?d:s==="light"?false:d);
        document.documentElement.classList.toggle("dark",dark);
        document.documentElement.classList.toggle("light",!dark);
        document.documentElement.style.colorScheme=dark?"dark":"light";
        var m=document.querySelector('meta[name="theme-color"]');
        if(m) m.content=dark?"#0f111a":"#f8fafc";
      })();
    </script>
  </head>
  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
