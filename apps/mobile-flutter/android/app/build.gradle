plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase config (google-services.json is gitignored; builds without it
    // fail — that file must come from the Firebase console).
    id "com.google.gms.google-services"
}

// Release signing is configured in android/key.properties, which is gitignored
// along with the keystore itself. When that file is absent — a fresh clone, CI,
// or anyone who is not the release manager — the release build falls back to the
// debug key so `flutter run --release` still works. Only a machine holding the
// real keystore can produce an upload-ready artifact.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystoreProperties.containsKey("storeFile")

// Sideload signing is a second, independent key configured in
// android/sideload-key.properties (also gitignored). It signs the APKs
// published on the website, whose signature users actually install.
//
// The two keys must not be shared. The Play upload key only ever hands an
// artifact to Google Play App Signing, which re-signs it with the per-app key
// Google manages; a publicly downloadable APK must not carry that secret. And a
// sideload APK signed with the debug key can never be upgraded onto a Play
// build of the same package, so the sideload key is a real, long-lived key
// rather than an accident.
def sideloadProperties = new Properties()
def sideloadPropertiesFile = rootProject.file("sideload-key.properties")
if (sideloadPropertiesFile.exists()) {
    sideloadPropertiesFile.withInputStream { sideloadProperties.load(it) }
}
def hasSideloadKeystore = sideloadProperties.containsKey("storeFile")

// Opt-in switch. Absent (the default) the release build is byte-for-byte the
// Play upload path it always was, so build_release.sh is untouched. Only
// scripts/build_sideload.sh passes this, and it is the single flag standing
// between the two keys.
def sideloadSigningRequested =
    (project.findProperty("sideloadSigning") ?: System.getenv("SIDELOAD_SIGNING") ?: "false")
        .toString().toBoolean()

// AdMob identifiers are supplied at build time, never committed. Each may be
// set as a Gradle property (-PadmobAppId=...) or an environment variable.
// They must be provided as a complete set: a mismatched set is a build error
// rather than a runtime surprise, because the AdMob app id and the ad unit ids
// must belong to the same AdMob app.
def admobPlaceholder = "ca-app-pub-0000000000000000"
def admobAppId = (project.findProperty("admobAppId") ?: System.getenv("ADMOB_APP_ID") ?: admobPlaceholder)
def admobBannerId = (project.findProperty("admobBannerAdUnitId") ?: System.getenv("ADMOB_BANNER_AD_UNIT_ID") ?: "")
def admobRewardedId = (project.findProperty("admobRewardedAdUnitId") ?: System.getenv("ADMOB_REWARDED_AD_UNIT_ID") ?: "")

// AdMob uses two identifier formats: an app id is ca-app-pub-<16 digits>~<digits>
// and belongs in the manifest, while an ad unit id is ca-app-pub-<16 digits>/<digits>
// and belongs in ad requests. Conflating them makes the SDK reject the app id, so
// each slot is validated against its own format.
def placeholderPubId = "0000000000000000"
def appIdMatcher = ~/^ca-app-pub-(\d{16})~\d{6,16}$/
def adUnitMatcher = ~/^ca-app-pub-(\d{16})\/\d{6,16}$/
def isPlaceholder = { String value -> value?.contains(placeholderPubId) }

def isRealAppId = { String value ->
    value != null && !isPlaceholder(value) && appIdMatcher.matcher(value).matches()
}
def isRealAdUnitId = { String value ->
    value != null && !isPlaceholder(value) && adUnitMatcher.matcher(value).matches()
}
// All three ids must come from one AdMob account, or nothing fills and nothing errors.
def publisherOf = { String value ->
    if (value == null || isPlaceholder(value)) return null
    def m = appIdMatcher.matcher(value)
    if (m.matches()) return m.group(1)
    m = adUnitMatcher.matcher(value)
    return m.matches() ? m.group(1) : null
}

def admobIdsSupplied = isRealAppId(admobAppId) || admobBannerId || admobRewardedId
def admobIdsWellFormed = isRealAppId(admobAppId) && isRealAdUnitId(admobBannerId) && isRealAdUnitId(admobRewardedId)
def admobPublishers = [publisherOf(admobAppId), publisherOf(admobBannerId), publisherOf(admobRewardedId)]
def admobSameAccount = !admobPublishers.contains(null) && admobPublishers.toSet().size() == 1
def admobIdsComplete = admobIdsWellFormed && admobSameAccount

android {
    namespace = "net.secretmsg.android_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Required by flutter_local_notifications (Java 8+ APIs on older runtimes).
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "net.secretmsg.android_app"
        // Floor: Android 7.0 (API 24). All plugins (FCM, notifications,
        // secure storage) support 24+; runtime permissions gate newer APIs.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Injected into AndroidManifest.xml as ${admobAppId}. Defaults to the
        // placeholder so debug/local builds always work; release builds assert
        // on the real value below.
        manifestPlaceholders += [admobAppId: admobAppId]
    }

    packaging {
        jniLibs {
            // Ship libapp.so and libflutter.so deflated rather than stored, which
            // sets android:extractNativeLibs="true" in the merged manifest.
            //
            // By default AGP stores .so files uncompressed so the loader can mmap
            // them straight out of the APK. That is the right trade for a Play
            // bundle, where Play controls delivery anyway, but the per-ABI APKs on
            // the website are downloaded whole by each user, and there the two
            // native libraries are 21.5 MB of a 26.6 MB x86_64 APK. AdMob's SDK
            // added ~2.4 MB on top of a v1.6.9 that already sat at 23.0 MiB, which
            // pushed x86_64 over the 25 MiB per-file ceiling that Cloudflare
            // Workers static assets impose on apps/web/public/downloads.
            //
            // Deflating costs one extraction step at install time and shrinks the
            // download roughly in half; the installed footprint is unchanged.
            //
            // The ceiling is a property of hosting the APKs on the website, and it
            // does not apply to the Play bundle, which is 61 MB and is never
            // served by us. So this is tied to the sideload switch: absent the
            // flag the Play upload path keeps AGP's default uncompressed .so
            // packaging, which is the better trade when the delivery channel
            // takes the file apart and re-serves it itself.
            useLegacyPackaging = sideloadSigningRequested
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
        sideload {
            if (hasSideloadKeystore) {
                storeFile = file(sideloadProperties["storeFile"])
                storePassword = sideloadProperties["storePassword"]
                keyAlias = sideloadProperties["keyAlias"]
                keyPassword = sideloadProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // Only an explicit opt-in reroutes release signing, and only onto a
            // key that actually exists. Anything else leaves the Play upload
            // path exactly as it was.
            if (sideloadSigningRequested) {
                if (hasSideloadKeystore) {
                    signingConfig = signingConfigs.sideload
                } else {
                    throw new GradleException(
                        "-PsideloadSigning=true was requested but android/sideload-key.properties " +
                        "is missing or has no storeFile. Run scripts/setup-sideload-keystore.sh, or " +
                        "drop the flag to build the Play upload artifact instead. Refusing to fall " +
                        "back to the debug key for a build intended for public download."
                    )
                }
            }
        }
    }
}

// A release artifact carrying the placeholder AdMob app id cannot serve ads and
// would be rejected or show empty slots in production, so refuse to build it
// instead of shipping something that silently does nothing. Debug builds stay
// permissive so local development needs no AdMob account.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { t ->
        t.project == project && t.name ==~ /(?i).*release.*/
    }
    if (!releaseRequested) return
    if (admobIdsSupplied && !admobIdsComplete) {
        def reason = ""
        if (admobIdsWellFormed && !admobSameAccount) {
            reason = "\nThe three ids do not share one publisher id. The app id uses the ~ form and " +
                     "ad unit ids use the / form, and all three must come from the same AdMob account.\n" +
                     "  publishers seen: " + admobPublishers
        }
        throw new GradleException(
            "Incomplete AdMob configuration. Provide all three as Gradle properties " +
            "or environment variables, and no others:" + reason + "\n" +
            "  -PadmobAppId=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY\n" +
            "  -PadmobBannerAdUnitId=ca-app-pub-XXXXXXXXXXXXXXXX/YYYYYYYYYY\n" +
            "  -PadmobRewardedAdUnitId=ca-app-pub-XXXXXXXXXXXXXXXX/YYYYYYYYYY\n" +
            "(env: ADMOB_APP_ID, ADMOB_BANNER_AD_UNIT_ID, ADMOB_REWARDED_AD_UNIT_ID)\n" +
            "Supplied -> app=${admobAppId} banner=${admobBannerId} rewarded=${admobRewardedId}"
        )
    }
    if (!admobIdsComplete) {
        throw new GradleException(
            "Refusing to build a release artifact with the placeholder AdMob app id " +
            "(${admobPlaceholder}). An upload-ready build must carry the real app id " +
            "and ad unit ids from the operator's AdMob console."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Desugared Java 8+ core libs (see compileOptions above).
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
