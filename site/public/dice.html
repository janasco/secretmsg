<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>TBH Roulette & Prompt Shuffle - SecretMsg</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/common.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#0b0e14",
            "primary": "#ffffff",
            "surface-dim": "#10131a",
            "on-background": "#e1e2eb",
            "surface-container-high": "#272a31",
            "surface-variant": "#32353c",
            "surface-container": "#1d2026"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script>
    (function() {
      const saved = localStorage.getItem('secretmsg_theme') || 'system';
      const isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    })();
  </script>
  <script src="js/theme.js"></script>
  <style>
    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }
  </style>
</head>
<body class="bg-[#0B0E14] text-white font-sans antialiased min-h-screen">
  <div class="mobile-viewport">
    <!-- Toast Notice -->
    <div id="toast" class="toast-notice">
      <span class="material-symbols-outlined text-[18px]">check_circle</span>
      <span id="toast-text">Prompt copied!</span>
    </div>

    <!-- Top App Bar -->
    <header class="sticky top-0 z-50 bg-[#0B0E14]/90 backdrop-blur-md border-b border-white/10 flex justify-between items-center h-14 px-4">
      <a href="index.html" aria-label="Go back" class="p-2 -ml-2 text-slate-300 hover:text-white transition-colors rounded-full flex items-center">
        <span class="material-symbols-outlined text-[24px]">arrow_back</span>
      </a>
      <h1 class="text-base font-bold text-white tracking-tight">TBH Roulette 🎲</h1>
      <a href="sticker-studio.html" aria-label="Create Sticker" class="p-2 -mr-2 text-slate-300 hover:text-white transition-colors rounded-full flex items-center">
        <span class="material-symbols-outlined text-[22px]">photo_filter</span>
      </a>
    </header>

    <!-- Main Canvas -->
    <main class="flex-1 px-4 py-4 flex flex-col gap-5 pb-28">
      <!-- Hero Section: Interactive 3D Die & Roll Action -->
      <section class="glass-panel rounded-3xl p-5 flex flex-col items-center justify-center text-center relative overflow-hidden border border-white/15">
        <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent pointer-events-none"></div>

        <!-- 3D Three.js Die Container -->
        <div class="relative w-44 h-44 rounded-full flex items-center justify-center my-1 cursor-pointer" onclick="rollDice()">
          <div class="absolute inset-0 bg-white/5 rounded-full blur-2xl"></div>
          <div id="threejs-dice-canvas" class="w-full h-full relative z-10"></div>
          <span id="dice-fallback" class="material-symbols-outlined text-[80px] text-white/20 absolute z-0 hidden">casino</span>
        </div>

        <!-- Roll Button -->
        <button id="btn-roll" onclick="rollDice()" class="w-full max-w-[260px] py-3 bg-white text-[#0B0E14] font-bold text-sm rounded-full white-glow pulse-glow active:scale-95 transition-all flex items-center justify-center gap-2 mt-2 shadow-lg">
          <span class="material-symbols-outlined text-[20px]">casino</span>
          Roll Prompt Roulette 🎲
        </button>

        <!-- Featured Prompt Card -->
        <div class="w-full bg-[#10131A] rounded-2xl p-4 mt-4 text-center border border-white/10 transition-all min-h-[72px] flex items-center justify-center">
          <p id="featured-prompt" class="text-sm font-semibold text-white leading-snug">
            "Send me an honest TBH. Don't hold back 🫣"
          </p>
        </div>

        <!-- Horizontal Action Row -->
        <div class="flex gap-2 w-full mt-3">
          <button onclick="useCurrentPrompt()" class="flex-1 py-2.5 px-3 bg-white text-[#0B0E14] rounded-full text-xs font-semibold hover:bg-slate-100 transition-colors flex items-center justify-center gap-1.5 active:scale-95">
            <span class="material-symbols-outlined text-[16px]">send</span> Send
          </button>
          <button onclick="exportCurrentPrompt()" class="flex-1 py-2.5 px-3 glass-panel rounded-full text-xs font-semibold text-white hover:bg-white/10 transition-colors flex items-center justify-center gap-1.5 active:scale-95">
            <span class="material-symbols-outlined text-[16px]">auto_awesome</span> Story Sticker
          </button>
          <button onclick="copyCurrentPrompt()" class="w-10 h-10 glass-panel rounded-full flex items-center justify-center text-white hover:bg-white/10 transition-colors shrink-0 active:scale-95" title="Copy Text">
            <span class="material-symbols-outlined text-[18px]">content_copy</span>
          </button>
        </div>
      </section>

      <!-- Category Filter -->
      <section class="overflow-x-auto no-scrollbar -mx-4 px-4">
        <div class="flex gap-2 min-w-max">
          <button data-cat="all" class="dice-cat-pill bg-white text-[#0B0E14] text-xs font-semibold px-4 py-2 rounded-full transition-all shadow-sm">
            🔥 All Vibes (9,000+)
          </button>
          <button data-cat="crush" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            💘 Crush & Flirt (1,500+)
          </button>
          <button data-cat="spicy" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            🌶️ Spicy (1,500+)
          </button>
          <button data-cat="secrets" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            🤫 Deep Secrets (1,500+)
          </button>
          <button data-cat="chaotic" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            🌪️ Chaotic & Wild (1,500+)
          </button>
          <button data-cat="realtalk" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            💬 Real Talk (1,500+)
          </button>
          <button data-cat="latenight" class="dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all">
            🌙 3AM Thoughts (1,500+)
          </button>
        </div>
      </section>

      <!-- Prompt Pool Grid -->
      <section class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Curated Roulette Pool</h3>
          <span id="pool-count" class="text-[11px] text-slate-400 font-mono">9,000 prompts</span>
        </div>

        <div id="pool-container" class="flex flex-col gap-2.5">
          <!-- Dynamically populated from window.SECRETMSG_ROULETTE -->
        </div>

        <button id="pool-load-more" class="w-full py-3 glass-panel glass-panel-hover rounded-2xl text-xs font-bold text-white flex items-center justify-center gap-2 mt-1 transition-all">
          <span id="pool-load-text">Load More Prompts</span>
          <span class="material-symbols-outlined text-[16px]">expand_more</span>
        </button>
      </section>
    </main>

    <!-- Persistent Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0B0E14]/95 backdrop-blur-xl border-t border-white/10 pb-safe">
      <div class="flex justify-around items-center h-16 max-w-xl mx-auto px-2">
        <a href="index.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-white py-1 px-3 transition-colors">
          <span class="material-symbols-outlined text-[24px]">home</span>
          <span class="text-[10px] font-semibold mt-0.5">Home</span>
        </a>
        <a href="dice.html" class="flex flex-col items-center justify-center text-white relative py-1 px-3 transition-colors">
          <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">casino</span>
          <span class="text-[10px] font-semibold mt-0.5">Dice</span>
          <span class="w-1 h-1 bg-white rounded-full mt-0.5"></span>
        </a>
        <a href="sticker-studio.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-white py-1 px-3 transition-colors">
          <span class="material-symbols-outlined text-[24px]">photo_filter</span>
          <span class="text-[10px] font-semibold mt-0.5">Stickers</span>
        </a>
        <a href="inbox.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-white relative py-1 px-3 transition-colors">
          <span class="material-symbols-outlined text-[24px]">mail</span>
          <span class="text-[10px] font-semibold mt-0.5">Inbox</span>
          <span class="absolute top-1 right-2.5 w-2 h-2 bg-rose-500 rounded-full border border-[#0B0E14]"></span>
        </a>
        <a href="profile.html" class="flex flex-col items-center justify-center text-slate-400 hover:text-white py-1 px-3 transition-colors">
          <span class="material-symbols-outlined text-[24px]">person</span>
          <span class="text-[10px] font-semibold mt-0.5">Profile</span>
        </a>
      </div>
    </nav>
  </div>

  <script src="js/roulette-data.js"></script>
  <script>
    // Prompt Pool Database (1,500+ Curated Prompts)
    const promptPool = window.SECRETMSG_ROULETTE || {
      all: [
        "Send me an honest TBH. Don't hold back 🫣",
        "Who has a secret crush on me? Be completely honest 💕",
        "What's one red flag you noticed about me that nobody talks about? 🚩",
        "Tell me something you've never had the courage to say in person 🤐",
        "If I was arrested without explanation, what would you assume I did? 🚓",
        "What was your honest first impression when we first met? 👀",
        "What song immediately reminds you of me? 🎵"
      ]
    };

    let activeCategory = 'all';
    let poolDisplayCount = 0;
    const POOL_PAGE_SIZE = 20;

    const poolContainer = document.getElementById('pool-container');
    const poolCount = document.getElementById('pool-count');
    const poolLoadMore = document.getElementById('pool-load-more');
    const poolLoadText = document.getElementById('pool-load-text');

    function getCategoryTag(cat) {
      switch(cat) {
        case 'crush': return { label: 'CRUSH', color: 'text-rose-400' };
        case 'spicy': return { label: 'SPICY', color: 'text-amber-400' };
        case 'secrets': return { label: 'SECRETS', color: 'text-violet-400' };
        case 'chaotic': return { label: 'CHAOTIC', color: 'text-emerald-400' };
        case 'realtalk': return { label: 'REAL TALK', color: 'text-sky-400' };
        case 'latenight': return { label: '3AM THOUGHTS', color: 'text-indigo-400' };
        default: return { label: 'VIRAL', color: 'text-slate-400' };
      }
    }

    function renderPoolItem(prompt, index) {
      const item = document.createElement('div');
      item.className = 'pool-item glass-panel glass-panel-hover rounded-2xl p-3.5 flex items-center justify-between gap-3 transition-transform active:scale-[0.99]';
      item.setAttribute('data-cat', activeCategory);

      const tagInfo = getCategoryTag(activeCategory === 'all' ? ['crush', 'spicy', 'secrets', 'chaotic', 'realtalk', 'latenight'][index % 6] : activeCategory);
      const rollsCount = (12 + (index * 1.3) % 40).toFixed(1);

      item.innerHTML = `
        <div class="flex-1">
          <span class="text-[10px] ${tagInfo.color} font-mono block mb-0.5">${tagInfo.label} • ${rollsCount}K ROLLS</span>
          <p class="pool-prompt-text text-xs font-medium text-white">"${prompt}"</p>
        </div>
        <button onclick="selectPoolPrompt(this)" class="px-3 py-1.5 bg-white/10 hover:bg-white text-slate-300 hover:text-[#0B0E14] rounded-full text-xs font-semibold transition-all shrink-0">
          Try
        </button>
      `;
      return item;
    }

    function filterPool(reset = false) {
      const list = promptPool[activeCategory] || promptPool.all || [];
      poolCount.textContent = `${list.length.toLocaleString()} prompts`;

      if (reset) {
        poolContainer.innerHTML = '';
        poolDisplayCount = 0;
      }

      const nextBatch = list.slice(poolDisplayCount, poolDisplayCount + POOL_PAGE_SIZE);
      const frag = document.createDocumentFragment();
      nextBatch.forEach((prompt, idx) => {
        frag.appendChild(renderPoolItem(prompt, poolDisplayCount + idx));
      });
      poolContainer.appendChild(frag);

      poolDisplayCount += nextBatch.length;

      if (poolDisplayCount >= list.length) {
        poolLoadMore.classList.add('hidden');
      } else {
        poolLoadMore.classList.remove('hidden');
        poolLoadText.textContent = `Load More Prompts (${poolDisplayCount} of ${list.length.toLocaleString()})`;
      }
    }

    poolLoadMore.addEventListener('click', () => {
      filterPool(false);
    });

    // Three.js 3D Minimalist Die Implementation
    let scene, camera, renderer, dieMesh;
    let isRolling = false;
    let targetRotationX = 0, targetRotationY = 0;

    function initThreeD() {
      const container = document.getElementById('threejs-dice-canvas');
      if (!container || typeof THREE === 'undefined') {
        document.getElementById('dice-fallback').classList.remove('hidden');
        return;
      }

      const width = container.clientWidth || 176;
      const height = container.clientHeight || 176;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.z = 4.8;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const geometry = new THREE.BoxGeometry(1.8, 1.8, 1.8);

      const createFace = (symbol) => {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, 244, 244);
        ctx.fillStyle = '#0B0E14';
        ctx.font = 'bold 120px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(symbol, 128, 136);
        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2, metalness: 0.1 });
      };

      const materials = [
        createFace('🎲'),
        createFace('💬'),
        createFace('💘'),
        createFace('🤫'),
        createFace('🔥'),
        createFace('✨')
      ];

      dieMesh = new THREE.Mesh(geometry, materials);
      scene.add(dieMesh);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const pointLight = new THREE.PointLight(0xffffff, 1.2);
      pointLight.position.set(4, 5, 5);
      scene.add(pointLight);

      function animate() {
        requestAnimationFrame(animate);
        if (isRolling) {
          dieMesh.rotation.x += 0.24;
          dieMesh.rotation.y += 0.32;
        } else {
          dieMesh.rotation.x += (targetRotationX - dieMesh.rotation.x) * 0.08;
          dieMesh.rotation.y += (targetRotationY - dieMesh.rotation.y) * 0.08;
          dieMesh.position.y = Math.sin(Date.now() * 0.003) * 0.08;
        }
        renderer.render(scene, camera);
      }
      animate();
    }

    window.addEventListener('load', () => {
      initThreeD();
      filterPool(true);
    });

    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      const list = promptPool[activeCategory] || promptPool.all;
      const randomPrompt = list[Math.floor(Math.random() * list.length)];

      setTimeout(() => {
        isRolling = false;
        targetRotationX = Math.round(Math.random() * 4) * Math.PI / 2;
        targetRotationY = Math.round(Math.random() * 4) * Math.PI / 2;
        document.getElementById('featured-prompt').textContent = `"${randomPrompt}"`;
        showToast('New prompt unlocked!');
      }, 700);
    }

    function useCurrentPrompt() {
      const prompt = document.getElementById('featured-prompt').textContent.replace(/"/g, '').trim();
      window.location.href = `compose.html?prompt=${encodeURIComponent(prompt)}`;
    }

    function exportCurrentPrompt() {
      const prompt = document.getElementById('featured-prompt').textContent.replace(/"/g, '').trim();
      window.location.href = `sticker-studio.html?question=${encodeURIComponent(prompt)}`;
    }

    function copyCurrentPrompt() {
      const prompt = document.getElementById('featured-prompt').textContent.replace(/"/g, '').trim();
      navigator.clipboard?.writeText(prompt);
      showToast('Prompt copied to clipboard!');
    }

    function selectPoolPrompt(button) {
      const text = button.parentElement.querySelector('.pool-prompt-text').textContent.replace(/"/g, '').trim();
      document.getElementById('featured-prompt').textContent = `"${text}"`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('Loaded into roulette card!');
    }

    // Category tabs
    const catPills = document.querySelectorAll('.dice-cat-pill');
    catPills.forEach(pill => {
      pill.addEventListener('click', () => {
        catPills.forEach(p => {
          p.className = 'dice-cat-pill glass-panel text-slate-300 hover:text-white text-xs font-semibold px-4 py-2 rounded-full transition-all';
        });
        pill.className = 'dice-cat-pill bg-white text-[#0B0E14] text-xs font-semibold px-4 py-2 rounded-full transition-all shadow-sm';
        activeCategory = pill.getAttribute('data-cat');
        filterPool(true);
        rollDice();
      });
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }
  </script>
</body>
</html>
